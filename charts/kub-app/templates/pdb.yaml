{{- if and .Values.deployments .Values.deployments.enabled .Values.pdb .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kub-app.fullname" $ }}
  labels:
    {{- include "kub-app.labels" $ | nindent 4 }}
spec:
  {{- if .Values.pdb.minAvailable }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kub-app.selectorLabels" $ | nindent 6 }}
{{- end }}
